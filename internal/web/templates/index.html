{{define "index"}}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>WhatsApp Scheduler</title>
        <!-- Swap 422 so validation errors from POST /messages reach #form-error. Other 4xx/5xx stay unswapped. -->
        <meta
            name="htmx-config"
            content='{"responseHandling":[{"code":"422","swap":true,"error":true},{"code":"[23]..","swap":true},{"code":"[45]..","swap":false,"error":true}]}'
        />
        <script src="/static/htmx.min.js"></script>
        <script src="/static/combobox.js" defer></script>
        <link rel="stylesheet" href="/static/style.css" />
    </head>
    <body>
        <h1>Scheduled messages</h1>

        {{template "session" .Session}}

        <form
            hx-post="/messages"
            hx-target="#messages"
            hx-swap="outerHTML"
            hx-on::after-request="if(event.detail.successful){this.reset();document.getElementById('form-error').textContent=''}"
        >
            <p id="form-error"></p>
            <div class="field">
                <label for="recipient">Recipient</label>
                <div class="combobox">
                    <input
                        id="recipient"
                        type="text"
                        role="combobox"
                        autocomplete="off"
                        aria-expanded="false"
                        aria-controls="contacts"
                        aria-autocomplete="list"
                        required
                        placeholder="Search contacts, or type a number with country code"
                    />
                    <input type="hidden" name="recipient_jid" />
                    <ul id="contacts" role="listbox" hidden>
                        {{range $i, $c := .Contacts}}
                        <li
                            role="option"
                            id="opt-{{$i}}"
                            data-jid="{{$c.JID}}"
                            data-name="{{$c.Primary}}"
                            data-search="{{$c.Search}}"
                        >
                            <span class="name">{{$c.Primary}}</span>
                            <span class="muted">{{if $c.IsGroup}}Group{{else}}{{$c.Secondary}}{{end}}</span>
                        </li>
                        {{end}}
                    </ul>
                </div>
            </div>
            <label
                >Send at <input name="send_at" type="datetime-local" required
            /></label>
            <label>Message <textarea name="body" required></textarea></label>
            <button type="submit">Schedule</button>
        </form>

        {{template "list" .}}
    </body>
</html>
{{end}}
