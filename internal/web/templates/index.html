{{define "index"}}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>WhatsApp Scheduler</title>
        <!-- Swap 422 so validation errors from the message form reach #form-error. Other 4xx/5xx stay unswapped. -->
        <meta
            name="htmx-config"
            content='{"responseHandling":[{"code":"422","swap":true,"error":true},{"code":"[23]..","swap":true},{"code":"[45]..","swap":false,"error":true}]}'
        />
        <script src="/static/htmx.min.js"></script>
        <script src="/static/combobox.js" defer></script>
        <link rel="stylesheet" href="/static/style.css" />
    </head>
    <body>
        <h1>Scheduled messages</h1>

        {{template "session" .Session}}

        {{template "form" .Form}}

        {{template "list" .}}

        <script>
            // The browser knows the user's zone; the server converts and stores it.
            // htmx.onLoad also runs when the blank form is swapped back in after an edit.
            // The edit form has no send_zone: an edit keeps the message's zone.
            htmx.onLoad(function (root) {
                var input = root.querySelector("#send_zone");
                if (!input) return;
                var zone =
                    Intl.DateTimeFormat().resolvedOptions().timeZone || "";
                input.value = zone;
                document.getElementById("zone-label").textContent = zone;
            });
        </script>
    </body>
</html>
{{end}}
