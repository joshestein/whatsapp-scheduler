{{define "index"}}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>WhatsApp Scheduler</title>
        <!-- Swap 422 so validation errors from the message form reach #form-error. Other 4xx/5xx stay unswapped. -->
        <meta
            name="htmx-config"
            content='{"responseHandling":[{"code":"422","swap":true,"error":true},{"code":"[23]..","swap":true},{"code":"[45]..","swap":false,"error":true}]}'
        />
        <script src="/static/htmx.min.js"></script>
        <script src="/static/combobox.js" defer></script>
        <link rel="stylesheet" href="/static/style.css" />
    </head>
    <body>
        <h1>Scheduled messages</h1>

        {{template "session" .Session}}

        {{template "form" .Form}}

        {{template "list" .}}

        <script>
            // The browser knows the user's zone; the server converts and stores it.
            // htmx.onLoad, not once: the blank form is swapped back in after an edit.
            htmx.onLoad(function (root) {
                var input = root.querySelector("#send_zone");
                if (!input) return;
                var zone =
                    Intl.DateTimeFormat().resolvedOptions().timeZone || "";
                input.value = zone;
                document.getElementById("zone-label").textContent = zone;
            });

            // Tint the row the form is editing. Every swap can change the form
            // or the list, so read both from the page each time.
            htmx.onLoad(function () {
                var form = document.getElementById("message-form");
                var id = form && form.dataset.editing;
                document.querySelectorAll("tr.editing").forEach(function (tr) {
                    tr.classList.remove("editing");
                });
                var row = id && document.getElementById("msg-" + id);
                if (row) row.classList.add("editing");
            });
        </script>
    </body>
</html>
{{end}}
